[agent]
  interval = "10s"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "myorg"
  bucket = "ebus"

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["ebusd/bai/+"]
  data_format = "json"
  topic_tag = "sensor_topic"
  name_override = "ebus"

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["ebusd/bai/Flame"]
  data_format = "json"
  json_string_fields = ["value_value"]
  topic_tag = "sensor_topic"
  name_override = "ebus"

[[processors.rename]]
  namepass = ["ebus"]
  [processors.rename.tagpass]
    sensor_topic = ["ebusd/bai/Flame"]
  [[processors.rename.replace]]
    field = "value_value"
    dest = "flame_raw"

[[processors.enum]]
  namepass = ["ebus"]
  [processors.enum.tagpass]
    sensor_topic = ["ebusd/bai/Flame"]
  [[processors.enum.mapping]]
    field = "flame_raw"
    dest = "flame_state"
    [processors.enum.mapping.value_mappings]
      "on" = 1
      "off" = 0

# Погода (Open-Meteo, свої координати) для аналітики опалення — кожні 15 хв
[[inputs.http]]
  interval = "15m"
  urls = ["https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.52&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,cloud_cover,wind_speed_10m,shortwave_radiation&timezone=UTC"]
  timeout = "30s"
  data_format = "json_v2"
  name_override = "weather"
  tagexclude = ["url", "host"]
  [inputs.http.tags]
    source = "live"
  [[inputs.http.json_v2]]
    measurement_name = "weather"
    [[inputs.http.json_v2.object]]
      path = "current"
      excluded_keys = ["time", "interval"]
